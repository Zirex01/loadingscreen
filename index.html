<!DOCTYPE html>
<html>
	<head>
		<meta name="robots" content="noindex" />
		<meta charset="utf-8" />
		<title>Genkai - Cargando</title>
		<script type="text/javascript">
			document.write(
				'<link rel="stylesheet" href="css/sleek.css?' +
					Math.random() +
					'">'
			);
		</script>
		<!-- ===== Barra de carga segmentada (Genkai) ===== -->
		<style>
			/* Contenedor: mas abajo, justo bajo el "Bienvenido al servidor" */
			#status-container {
				position: fixed;
				left: 50%;
				bottom: 8px;            /* <- sube o baja la barra cambiando este valor */
				width: 46%;
				margin-left: -23%;
				z-index: 5;
				font-family: "Segoe UI", Arial, sans-serif;
			}

			/* Linea de texto encima de la barra */
			#status-left {
				float: left;
				max-width: 80%;
				overflow: hidden;
				white-space: nowrap;
				text-overflow: ellipsis;
				font-size: 11px;
				line-height: 16px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 2px;
				color: rgba(255, 255, 255, 0.85);
				text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
			}
			#status-right {
				float: right;
				font-size: 13px;
				line-height: 16px;
				font-weight: 700;
				letter-spacing: 1px;
				color: #ffffff;
				text-shadow: 0 0 6px rgba(255, 255, 255, 0.6), 0 1px 3px rgba(0, 0, 0, 0.9);
			}

			/* ---- Pista de la barra (cortada en diagonal) ---- */
			#loading {
				clear: both;
				position: relative;
				top: 5px;
				height: 10px;
				padding: 3px;
				background: rgba(0, 0, 0, 0.6);
				border: 1px solid rgba(255, 255, 255, 0.35);
				box-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
				-webkit-transform: skewX(-25deg);
				transform: skewX(-25deg);
			}
			/* Esquinas tipo "marco" */
			#loading:before,
			#loading:after {
				content: "";
				position: absolute;
				width: 8px;
				height: 8px;
				border-color: #ffffff;
				border-style: solid;
			}
			#loading:before { left: -5px;  top: -5px;    border-width: 2px 0 0 2px; }
			#loading:after  { right: -5px; bottom: -5px; border-width: 0 2px 2px 0; }

			/* ---- Relleno: bloques blancos separados ---- */
			#loading-progress {
				position: relative;
				height: 100%;
				width: 0%;
				min-width: 0;
				background-image: -webkit-repeating-linear-gradient(left, #ffffff 0, #ffffff 9px, transparent 9px, transparent 13px);
				background-image: repeating-linear-gradient(to right, #ffffff 0, #ffffff 9px, transparent 9px, transparent 13px);
				-webkit-filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.7));
				filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.7));
				-webkit-transition: width 0.6s ease-out;
				transition: width 0.6s ease-out;
			}
			/* Bloque de la punta que parpadea */
			#loading-progress:after {
				content: "";
				position: absolute;
				top: 0;
				right: 0;
				width: 9px;
				height: 100%;
				background: #ffffff;
				box-shadow: 0 0 10px 2px #ffffff;
				-webkit-animation: punta-pulso 0.9s ease-in-out infinite;
				animation: punta-pulso 0.9s ease-in-out infinite;
			}
			@-webkit-keyframes punta-pulso { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
			@keyframes punta-pulso { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

			#messages {
				display: none;
				clear: both;
				padding-top: 16px;
				text-align: center;
				font-size: 16px;
			}
		</style>
	</head>
	<body>
		<div id="video-container"></div>
		<div id="player"></div>
		<div id="overlay"></div>
		<div id="header">
			<div id="title"></div>
			<div id="subtitle" data-lang="below_logo"></div>
		</div>
		<div id="status-container">
			<span id="status-left" data-lang="loading"></span>
			<span id="status-right">0%</span>
			<div id="loading">
				<div id="loading-progress"></div>
			</div>
			<div id="messages"></div>
		</div>
		<div id="music">
			<span data-lang="now_playing"></span>
			<div id="music-name"></div>
		</div>
		<div id="enable-audio">Click here to enable music preview</div>
		<div id="error-box"></div>
		<div id="warn"></div>
		<script src="js/vendor/objectFitPolyfill.min.js"></script>
		<script src="js/vendor/jquery-2.1.1.min.js"></script>
		<script src="js/vendor/jquery.backstretch.min.js"></script>
		<script src="js/sleek.js"></script>
		<!-- ===== Texto de la barra de carga en espanol ===== -->
		<script>
			(function () {
				var traducciones = {
					"Retrieving server info...": "Obteniendo informacion del servidor...",
					"Sending client info...": "Enviando informacion del cliente...",
					"Client info sent!": "Informacion enviada",
					"Mounting Addons": "Montando addons...",
					"Workshop Complete": "Addons del Workshop listos",
					"Lua Started!": "Iniciando scripts...",
					"Starting Lua...": "Iniciando scripts...",
					"Received all Lua files we needed!": "Scripts recibidos",
					"Ready to play!": "Listo para jugar!"
				};
				function ponerTexto(txt) {
					var el = document.getElementById("status-left");
					if (el) el.textContent = txt;
				}
				function envolver(nombre, fn) {
					var original = window[nombre];
					window[nombre] = function () {
						if (typeof original === "function") original.apply(this, arguments);
						try { fn.apply(this, arguments); } catch (e) {}
					};
				}
				envolver("SetStatusChanged", function (status) {
					var t = traducciones[status];
					if (!t) {
						var m;
						if ((m = /^(\d+)\/(\d+)/.exec(status))) t = "Descargando addons del Workshop (" + m[1] + "/" + m[2] + ")";
						else if ((m = /^Downloaded (\d+) of (\d+)/.exec(status))) t = "Descargando archivos (" + m[1] + "/" + m[2] + ")";
						else t = status;
					}
					ponerTexto(t);
				});
				envolver("DownloadingFile", function (archivo) {
					var nombre = String(archivo).split("/").pop();
					ponerTexto("Descargando: " + nombre);
				});
			})();
		</script>
	</body>
</html>
