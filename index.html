<!DOCTYPE html>
<html>
	<head>
		<meta name="robots" content="noindex" />
		<meta charset="utf-8" />
		<title>Genkai - Cargando</title>
		<script type="text/javascript">
			document.write(
				'<link rel="stylesheet" href="css/sleek.css?' +
					Math.random() +
					'">'
			);
		</script>
		<!-- ===== Barra de carga estilo ninja (Genkai) ===== -->
		<style>
			#status-container {
				position: fixed;
				left: 50%;
				bottom: 20px;
				width: 50%;
				margin-left: -25%;
				font-size: 14px;
				line-height: 18px;
				z-index: 5;
			}
			#status-left {
				float: left;
				max-width: 78%;
				margin-left: 26px;
				overflow: hidden;
				white-space: nowrap;
				text-overflow: ellipsis;
				font-family: Georgia, "Times New Roman", serif;
				font-style: italic;
				color: #d6ecff;
				letter-spacing: 1px;
			}
			#status-left:before {
				content: "\25C6  ";
				color: #3fa0ff;
				font-style: normal;
			}
			#status-right {
				float: right;
				margin-right: 26px;
				font-family: Georgia, "Times New Roman", serif;
				font-weight: bold;
				font-size: 16px;
				color: #ffffff;
				text-shadow: 0 0 8px #2f8bff, 2px 2px 0 rgba(0, 0, 0, 0.6);
			}

			/* ---- Pergamino (track) ---- */
			#loading {
				clear: both;
				position: relative;
				top: 8px;
				height: 14px;
				margin: 0 14px;
				background-color: #0b1224;
				background-image: -webkit-repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 4px, transparent 4px, transparent 8px);
				background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 4px, transparent 4px, transparent 8px);
				border-top: 2px solid #c9b58a;
				border-bottom: 2px solid #c9b58a;
				box-shadow: 0 0 14px rgba(20, 90, 255, 0.35), inset 0 0 6px rgba(0, 0, 0, 0.9);
			}
			/* Rodillos de madera del pergamino */
			#loading:before,
			#loading:after {
				content: "";
				position: absolute;
				top: -6px;
				width: 12px;
				height: 22px;
				border-radius: 4px;
				background: #6b3f1d;
				background: -webkit-linear-gradient(left, #3d220e, #9a6331 45%, #5a3417);
				background: linear-gradient(to right, #3d220e, #9a6331 45%, #5a3417);
				border: 1px solid #2a1608;
				box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
			}
			#loading:before { left: -13px; }
			#loading:after  { right: -13px; }

			/* ---- Chakra (relleno) ---- */
			#loading-progress {
				position: relative;
				height: 100%;
				width: 0%;
				min-width: 3%;
				-webkit-transition: width 0.6s ease-out;
				transition: width 0.6s ease-out;
			}
			#chakra {
				position: absolute;
				top: 0; left: 0; right: 0; bottom: 0;
				overflow: hidden;
				background-color: #1e6bff;
				background-image:
					-webkit-repeating-linear-gradient(120deg, rgba(255,255,255,0) 0, rgba(255,255,255,0) 10px, rgba(190,235,255,0.35) 14px, rgba(255,255,255,0) 18px),
					-webkit-linear-gradient(top, #8fdcff, #2f8bff 45%, #0a3dff);
				background-image:
					repeating-linear-gradient(120deg, rgba(255,255,255,0) 0, rgba(255,255,255,0) 10px, rgba(190,235,255,0.35) 14px, rgba(255,255,255,0) 18px),
					linear-gradient(to bottom, #8fdcff, #2f8bff 45%, #0a3dff);
				background-size: 40px 100%, 100% 100%;
				box-shadow: 0 0 14px #2f8bff, 0 0 4px #bfe9ff;
				-webkit-animation: chakra-fluye 0.8s linear infinite;
				animation: chakra-fluye 0.8s linear infinite;
			}
			@-webkit-keyframes chakra-fluye { from { background-position: 0 0, 0 0; } to { background-position: 40px 0, 0 0; } }
			@keyframes chakra-fluye { from { background-position: 0 0, 0 0; } to { background-position: 40px 0, 0 0; } }

			/* ---- Shuriken girando en la punta ---- */
			#shuriken {
				position: absolute;
				right: -21px;
				top: -14px;
				width: 42px;
				height: 42px;
				-webkit-filter: drop-shadow(0 0 7px #6cc4ff);
				filter: drop-shadow(0 0 7px #6cc4ff);
				-webkit-animation: shuriken-gira 0.7s linear infinite;
				animation: shuriken-gira 0.7s linear infinite;
			}
			#shuriken svg { display: block; width: 42px; height: 42px; }
			@-webkit-keyframes shuriken-gira { from { -webkit-transform: rotate(0deg); } to { -webkit-transform: rotate(360deg); } }
			@keyframes shuriken-gira { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

			#messages {
				display: none;
				clear: both;
				padding-top: 16px;
				text-align: center;
				font-size: 16px;
			}
		</style>
	</head>
	<body>
		<div id="video-container"></div>
		<div id="player"></div>
		<div id="overlay"></div>
		<div id="header">
			<div id="title"></div>
			<div id="subtitle" data-lang="below_logo"></div>
		</div>
		<div id="status-container">
			<span id="status-left" data-lang="loading"></span>
			<span id="status-right">0%</span>
			<div id="loading">
				<div id="loading-progress">
					<div id="chakra"></div>
					<div id="shuriken">
						<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
							<defs>
								<linearGradient id="acero" x1="0" y1="0" x2="1" y2="1">
									<stop offset="0" stop-color="#ffffff" />
									<stop offset="0.5" stop-color="#b9c6d8" />
									<stop offset="1" stop-color="#5d6b80" />
								</linearGradient>
							</defs>
							<path d="M50 2 L62 38 L98 50 L62 62 L50 98 L38 62 L2 50 L38 38 Z" fill="url(#acero)" stroke="#1b2230" stroke-width="3" stroke-linejoin="round" />
							<circle cx="50" cy="50" r="9" fill="#0b1224" stroke="#c9d3e0" stroke-width="3" />
						</svg>
					</div>
				</div>
			</div>
			<div id="messages"></div>
		</div>
		<div id="music">
			<span data-lang="now_playing"></span>
			<div id="music-name"></div>
		</div>
		<div id="enable-audio">Click here to enable music preview</div>
		<div id="error-box"></div>
		<div id="warn"></div>
		<script src="js/vendor/objectFitPolyfill.min.js"></script>
		<script src="js/vendor/jquery-2.1.1.min.js"></script>
		<script src="js/vendor/jquery.backstretch.min.js"></script>
		<script src="js/sleek.js"></script>
		<!-- ===== Texto de la barra de carga en espanol ===== -->
		<script>
			(function () {
				var traducciones = {
					"Retrieving server info...": "Obteniendo informacion del servidor...",
					"Sending client info...": "Enviando informacion del cliente...",
					"Client info sent!": "Informacion enviada",
					"Mounting Addons": "Montando addons...",
					"Workshop Complete": "Addons del Workshop listos",
					"Lua Started!": "Iniciando scripts...",
					"Starting Lua...": "Iniciando scripts...",
					"Received all Lua files we needed!": "Scripts recibidos",
					"Ready to play!": "Listo para jugar!"
				};
				function ponerTexto(txt) {
					var el = document.getElementById("status-left");
					if (el) el.textContent = txt;
				}
				function envolver(nombre, fn) {
					var original = window[nombre];
					window[nombre] = function () {
						if (typeof original === "function") original.apply(this, arguments);
						try { fn.apply(this, arguments); } catch (e) {}
					};
				}
				envolver("SetStatusChanged", function (status) {
					var t = traducciones[status];
					if (!t) {
						var m;
						if ((m = /^(\d+)\/(\d+)/.exec(status))) t = "Descargando addons del Workshop (" + m[1] + "/" + m[2] + ")";
						else if ((m = /^Downloaded (\d+) of (\d+)/.exec(status))) t = "Descargando archivos (" + m[1] + "/" + m[2] + ")";
						else t = status;
					}
					ponerTexto(t);
				});
				envolver("DownloadingFile", function (archivo) {
					var nombre = String(archivo).split("/").pop();
					ponerTexto("Descargando: " + nombre);
				});
			})();
		</script>
	</body>
</html>
